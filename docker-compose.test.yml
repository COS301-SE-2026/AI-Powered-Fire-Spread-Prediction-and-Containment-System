services:
  test-db:

    image: postgis/postgis:15-3.3

    container_name: fireaway_test_db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: test_fire_db

    ports: 
      - "5433:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d test_fire_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    
    restart: unless-stopped

  test-minio:
    image: minio/minio:latest
    container_name: fireaway_test_minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: miniosupersecretpassword
    command: server /data --console-address ":9001"
    ports: 
      - "9000:9000"
      - "9001:9001"
    
    restart: unless-stopped