services:
  postgres:
    container_name: staging-postgres-db
    ports:
      - "127.0.0.1:5433:5432"
    deploy: 
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.5"
          memory: 64M

  pgadmin:
    container_name: staging-pgadmin
    profiles: ["debug"]
    ports: []

  backend:
    container_name: staging-python-backend
    image: ${BACKEND_IMAGE}
    ports: []
    restart: always
    volumes:
      - /app
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
        reservations:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AWS_REGION: ${AWS_REGION}
      SQS_QUEUE_URL: ${SQS_QUEUE_URL}
      SQS_GPU_JOB_QUEUE_URL: ${SQS_GPU_JOB_QUEUE_URL}
      GPU_RESULTS_QUEUE_URL: ${GPU_RESULTS_QUEUE_URL}
      SNS_TOPIC_ARN: ${SNS_TOPIC_ARN}
      WEATHER_API_SECRET_NAME: ${WEATHER_API_SECRET_NAME}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      VALKEY_HOST: valkey
      VALKEY_PORT: 6379
      MINIO_ENDPOINT: staging-minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: fire-images
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8001"]

  frontend:
    container_name: staging-next-frontend
    image: ${FRONTEND_IMAGE}
    ports: []
    restart: always
    volumes:
      - /app
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    command: ["yarn", "start"]
    environment:
      NODE_ENV: production
      BACKEND_INTERNAL_URL: http://staging-python-backend:8001

  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    container_name: caddy-staging
    restart: always
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 64M
        reservations:
          cpus: "0.05"
          memory: 16M
    volumes:
      - /home/ubuntu/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /home/ubuntu/app/cloudflare-origin.pem:/etc/caddy/cloudflare-origin.pem:ro
      - /home/ubuntu/app/cloudflare-origin.key:/etc/caddy/cloudflare-origin.key:ro
      - caddy_staging_data:/data
      - caddy_staging_config:/config
    networks:
      - default

  valkey:
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: "128M"
        reservations:
          cpus: "0.05"
          memory: 32M

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: staging-minio
    restart: always
    command: ["server", "/data", "--console-address", ":9001"]
    deploy: 
      resources:
        limits:
          cpus: "0.3"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_staging_data:/data

volumes:
  caddy_staging_data:
  caddy_staging_config:
  minio_staging_data:
