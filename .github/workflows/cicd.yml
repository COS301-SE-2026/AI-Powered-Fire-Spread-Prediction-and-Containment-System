name: CI/CD

on:
  pull_request:

jobs:
  backend-unit-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend/testing
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: app/backend/requirements*.txt
      
      - name: Install dependencies
        working-directory: app/backend
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      
      - name: Run unit tests
        run: |
          coverage erase
          pytest --cov=. --cov-report=xml unit
      
      - name: Post coverage comment
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COVERAGE_PATH: app/backend/testing

  backend-integration-tests:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend/testing
    services:
      postgres:
        image: postgis/postgis:15-3.3
        env: 
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_fire_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test_fire_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      minio:
          image: minio/minio:latest
          env:
            MINIO_ROOT_USER: admin
            MINIO_ROOT_PASSWORD: miniosupersecretpassword
          ports:
            - 9000:9000
          command: server /data
          options: >-
            --health-cmd "curl -f http://localhost:9000/minio/health/ready || exit 1"
            --health-interval 10s
            --health-timeout 5s
            --health-retries 5
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5433/test_fire_db"
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: admin
      MINIO_SECRET_KEY: miniosupersecretpassword
      MINIO_SECURE: "false"
      MINIO_BUCKET: fire-reports
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: app/backend/requirements*.txt
      
      - name: Install dependencies
        working-directory: app/backend
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run integration tests
        run: |
          coverage erase
          pytest --cov=. --cov-report=xml integration

      - name: Post coverage comment
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COVERAGE_PATH: app/backend/testing

          

  backend-pylint:
    name: Backend Lint (pylint)
    runs-on: ubuntu-latest
    defaults:
        run:
            working-directory: app/backend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: app/backend/requirements*.txt

      - name: Install dependencies
        run: | 
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run pylint
        run: PYTHONPATH=src:. pylint src --fail-under=8.0

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install

      - name: Build
        run: yarn run build

  frontend-eslint:
    name: Frontend Lint (ESLint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: app/frontend/yarn.lock

      - name: Install dependencies
        run: yarn install

      - name: Run ESLint
        run: yarn eslint . --ext .js,.jsx,.ts,.tsx

  frontend-react-doctor:
    name: React Doctor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Run React Doctor
        uses: millionco/react-doctor@736abc183ac491b4e954fc6bedec3a9a1b73d38b
        with:
          directory: app/frontend
          blocking: error

  frontend-e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    needs: frontend-build
    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_fire_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test_fire_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: admin
          MINIO_ROOT_PASSWORD: miniosupersecretpassword
        ports:
          - 9000:9000
        command: server /data

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: "pip install --require-hashes --only-binary :all: -r app/backend/requirements.txt"

      - name: Launch backend
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5433/test_fire_db"
          MINIO_ENDPOINT: localhost:9000
          MINIO_ACCESS_KEY: admin
          MINIO_SECRET_KEY: miniosupersecretpassword
          MINIO_BUCKET: fire-reports
          JWT_SECRET: "your-super-secret-key-change-this"
        run: |
          cd app/backend
          nohup uvicorn main:app --host 0.0.0.0 --port 8000 &
          for i in {1..30}; do
            curl -sf http://localhost:8000/docs > /dev/null && break
            sleep 1
          done

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: app/frontend/yarn.lock

      - name: Install frontend dependencies
        working-directory: app/frontend
        run: yarn install

      - name: Install Playwright browsers
        working-directory: app/frontend
        run: yarn playwright install --with-deps

      - name: Run Playwright Tests
        working-directory: app/frontend
        env:
          CI: true
          BACKEND_INTERNAL_URL: "http://localhost:8000"
        run: yarn test

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/frontend/playwright-report/
          retention-days: 7

 