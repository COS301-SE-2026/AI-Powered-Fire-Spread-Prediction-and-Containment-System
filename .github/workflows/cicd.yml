name: CI/CD

on:
  pull_request:

jobs:
  backend-e2e:
    name: Backend E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend/src
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests

  backend-pylint:
    name: Backend Lint (pylint)
    runs-on: ubuntu-latest
    defaults:
        run:
            working-directory: app/backend/src
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pylint
        run: pylint **/**/**/*.py --fail-under=8.0

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend/src
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: app/frontend/src/yarn.lock

      - name: Install dependencies
        run: yarn install

      - name: Build
        run: yarn run build
    
  frontend-eslint:
    name: Frontend Lint (ESLint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: app/frontend/src/yarn.lock

      - name: Install dependencies
        run: yarn install
        
      - name: Run ESLint
        run: yarn eslint

  frontend-e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    needs: frontend-build
    defaults:
      run:
        working-directory: app/frontend/src
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: app/frontend/src/yarn.lock

      - name: Install Dependencies
        run: yarn install

      - name: Install Playwright browsers
        run: yarn playwright install --with-deps

      - name: Run Playwright Tests
        run: yarn playwright test

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/frontend/src/playwright-report/
          retention-days: 7
  
  frontend-react-doctor:
    name: React Doctor
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend/src

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: app/frontend/src/yarn.lock

      - name: Install dependencies
        run: yarn install

      - name: Run React Doctor
        run: yarn doctor 