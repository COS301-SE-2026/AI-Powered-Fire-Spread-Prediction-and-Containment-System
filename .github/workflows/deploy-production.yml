name: production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: aws-deploy
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "tag=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Install fish
        run: sudo apt-get update && sudo apt-get install -y fish
      
      - name: Blue/Green deploy
        run: fish scripts/prod-deploy.fish ${{ steps.tag.outputs.tag }} ${{ steps.tag.outputs.tag }}

