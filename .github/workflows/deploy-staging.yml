name: staging

on:
  push:
    branches: [staging_v2]
  workflow_dispatch:

concurrency:
  group: aws-deploy
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-backend
      - name: Lint backend
        run: PYTHONPATH=. pylint --rcfile=app/backend/.pylintrc --recursive=y app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: app/frontend/yarn.lock
      - name: Lint frontend
        working-directory: app/frontend
        run: |
          yarn install --frozen-lockfile
          yarn eslint . --ext .js,.jsx,.ts,.tsx
  
  build:
    needs: lint
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "tag=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with: 
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - id: exists
        run: |
          for r in backend frontend; do
            if aws ecr describe-images --repository-name fireaway-ryan-$r \
                --image-ids imageTag=${{ steps.tag.outputs.tag }} >/dev/null 2>&1; then
              echo "$r=true" >> "$GITHUB_OUTPUT"
            fi
          done
      
      - uses: docker/setup-buildx-action@v3

      - name: Build backend
        if: steps.exists.outputs.backend != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app/backend/Dockerfile
          target: prod
          push: true
          tags: |
            ${{ env.REGISTRY }}/fireaway-ryan-backend:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/fireaway-ryan-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      
      - name: Build frontend
        if: steps.exists.outputs.frontend != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app/frontend/Dockerfile
          target: prod
          push: true
          build-args: |
            NEXT_PUBLIC_MAPBOX_TOKEN=${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
            NEXT_PUBLIC_API_URL=
          tags: |
            ${{ env.REGISTRY }}/fireaway-ryan-frontend:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/fireaway-ryan-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      
      - name: Verify Mapbox token baked in
        if: steps.exists.outputs.frontend != 'true'
        run: |
          img=${{ env.REGISTRY }}/fireaway-ryan-frontend:${{ steps.tag.outputs.tag }}
          docker run --rm "$img" sh -c 'grep -rq "pk.ey" .next/' \
            || { echo "Mapbox token missing from bundle"; exit 1; }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Install fish
        run: sudo apt-get update && sudo apt-get install -y fish
      
      - name: Deploy to staging
        run: fish scripts/staging-deploy.fish ${{ needs.build.outputs.tag }} ${{ needs.build.outputs.tag }}
