name: Deploy to Staging

on:
    push:
        branches:
            - staging

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Deploy to Staging
              uses: appleboy/ssh-action@v1.0.3
              with:
                host: ${{ secrets.EC2_HOST }}
                username: ${{ secrets.EC2_USER }}
                key: ${{ secrets.EC2_SSH_KEY }}
                command_timeout: 30m
                script: |
                    cd /home/ubuntu/staging
                    git fetch origin staging
                    git reset --hard origin/staging
                    cp /home/ubuntu/app/app/frontend/src/Dockerfile app/frontend/src/Dockerfile
                    cp /home/ubuntu/app/app/frontend/src/package.json app/frontend/src/package.json
                    cp /home/ubuntu/app/app/frontend/src/tsconfig.json app/frontend/src/tsconfig.json
                    docker compose -p staging -f docker-compose.yml -f docker-compose.staging.yml down
                    docker rmi staging-frontend staging-backend 2>/dev/null || true
                    docker compose -p staging -f docker-compose.yml -f docker-compose.staging.yml up -d --build
                    docker network disconnect staging_default caddy 2>/dev/null || true
                    docker network connect staging_default caddy
                    docker system prune -f