[tool.coverage.run]
data_file = ".coverage"
branch = true
relative_files = true
source = ["app/backend"]
omit = [
    "*/testing/*",
    "*/seed.py",
    "*/test_api.py",
    "*/ml/training/build_*.py",
    "*/ml/training/load_real_dataset.py",
    "*/ml/training/synthetic_data.py",
    "*/ml/training/train_ignition.py",
    "*/src/ai/build_*.py",
    "*/src/ai/inspect_fire.py",
    "*/migrations/*",
    "*/startup_migrations.py",
    "*/audit_log.py"
]

[tool.coverage.paths]
source = ["app/backend", "/github/workspace/app/backend"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
omit = [
    "*/testing/*",
    "*/seed.py",
    "*/test_api.py",
    "*/ml/training/build_*.py",
    "*/ml/training/load_real_dataset.py",
    "*/ml/training/synthetic_data.py",
    "*/ml/training/train_ignition.py",
    "*/src/ai/build_*.py",
    "*/src/ai/inspect_fire.py",
    "*/migrations/*",
    "*/startup_migrations.py",
    "*/audit_log.py"
]