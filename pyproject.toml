[tool.coverage.run]
data_file = ".coverage"
branch = true
relative_files = true
source = ["app/backend"]

[tool.coverage.paths]
source = ["app/backend", "/github/workspace/app/backend"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
omit = [
    "app/backend/testing/*",
    "app/backend/seed.py",
    "app/backend/test_api.py",
    "app/backend/ml/training/build_*.py",
    "app/backend/ml/training/load_real_dataset.py",
    "app/backend/ml/training/synthetic_data.py",
    "app/backend/ml/training/train_ignition.py",
    "app/backend/src/ai/build_*.py",
    "app/backend/src/ai/inspect_fire.py",
    "app/backend/migrations/*",
    "app/backend/startup_migrations.py",
]