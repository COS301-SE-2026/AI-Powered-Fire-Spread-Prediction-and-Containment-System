services:
  nginx:
    image: nginx:alpine
    container_name: nginx-gateway
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_healthy

  postgres:
    image: postgis/postgis:15-3.5
    platform: linux/amd64
    container_name: postgres-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./database/postgres:/var/lib/postgresql/data:Z
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    ports:
      - "8080:80"
    depends_on:
      - postgres

  backend:
    cap_add:
      - SYS_PTRACE
    build:
      context: .
      dockerfile: app/backend/Dockerfile
    container_name: python-backend
    environment:
      - VALKEY_HOST=valkey
      - MINIO_ENDPOINT=minio:9000
      - PYTHONPATH=/
      - VALKEY_PORT=6379
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      valkey:
        condition: service_healthy
    volumes:
      - .:/app:Z
      - /app/venv  
    ports:
      - "8000:8000"
    command: ["uvicorn", "app.backend.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile
    container_name: next-frontend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_started
    volumes:
      - ./app/frontend:/app:z
      - frontend_node_modules:/app/node_modules:Z
    expose:
      - "3000"
    environment:
      NODE_ENV: development
    command: ["sh", "-c", "yarn install && yarn dev"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  minio:
    image: minio/minio:latest
    container_name: minio-storage
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./database/minio:/data:Z
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://minio:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
  valkey:
    image: valkey/valkey:latest
    container_name: valkey-cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      
  
  
  reseed:
    build:
      context: ./app/backend
      dockerfile: Dockerfile
    profiles: ["tools"]
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app/src:/app
      - SEED_DEFAULT_PASSWORD=${SEED_DEFAULT_PASSWORD}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD}
    volumes:
      - ./app/backend:/app:Z
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "seed.py", "--reseed"]

