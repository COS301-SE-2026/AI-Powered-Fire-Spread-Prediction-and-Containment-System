name: fireaway

services:
  backend:
    working_dir: /app
    env_file:
      [.env]
    environment:
      VALKEY_HOST: valkey
      MINIO_ENDPOINT: minio:9000
      PYTHONPATH: /app
      VALKEY_PORT: "6379"
      AWS_REGION: ${AWS_REGION}
      INFERENCE_QUEUE_URL: ${INFERENCE_QUEUE_URL:?set in .env}
      ARTIFACTS_S3_BUCKET: ${ARTIFACTS_S3_BUCKET:-fireaway-ryan-artifacts}
      RESULTS_QUEUE_URL: ${RESULTS_QUEUE_URL:?set in .env}
      ARTIFACTS_ROOT: /mnt/fire-system-artifacts
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
      valkey:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      [edge,internal]

  frontend:
    restart: unless-stopped
    env_file:
      [.env]
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:3000 > /dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      [edge]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    env_file:
      [.env]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_DRIVE_MIN_FREE_DISK: "500MB"
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      [internal]

  valkey:
    image: valkey/valkey:latest
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkeydata:/data
    healthcheck:
      test: [ "CMD", "valkey-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      [internal]

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge
  
volumes:
  miniodata:
  valkeydata:

