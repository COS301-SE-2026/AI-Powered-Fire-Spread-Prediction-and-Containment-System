name: fireaway

services:
  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      [edge]

  postgres:
    image: postgis/postgis:15-3.5
    platform: linux/amd64
    restart: unless-stopped
    env_file:
      [.env]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      [internal]

  # pgadmin:
  #   image: dpage/pgadmin4:latest
  #   container_name: pgadmin
  #   restart: unless-stopped
  #   env_file:
  #     - .env
  #   environment:
  #     PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
  #   volumes:
  #     - pgadmin-data:/var/lib/pgadmin
  #   ports:
  #     - "127.0.0.1:8080:80"
  #   depends_on:
  #     - postgres

  backend:
    build:
      context: .
      dockerfile: app/backend/Dockerfile
      target: prod
    working_dir: /app
    env_file:
      [.env]
    environment:
      VALKEY_HOST: valkey
      MINIO_ENDPOINT: minio:9000
      PYTHONPATH: /app
      VALKEY_PORT: "6379"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      valkey:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      [edge,internal]

  frontend:
    build:
      context: .
      dockerfile: app/frontend/Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_API_URL: /api 
        NEXT_PUBLIC_MAPBOX_TOKEN: ${NEXT_PUBLIC_MAPBOX_TOKEN:?}
    restart: unless-stopped
    env_file:
      [.env]
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:3000 > /dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      [edge]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    env_file:
      [.env]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_DRIVE_MIN_FREE_DISK: "500MB"
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      [internal]

  valkey:
    image: valkey/valkey:latest
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkeydata:/data
    healthcheck:
      test: [ "CMD", "valkey-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      [internal]

  reseed:
    build:
      context: .
      dockerfile: ./app/backend/Dockerfile
      target: dev
    profiles: [ "tools" ]
    env_file:
      [.env]
    environment:
      - PYTHONPATH=/app
      - SEED_DEFAULT_PASSWORD=${SEED_DEFAULT_PASSWORD}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    command: [ "python", "-m", "app.backend.seed", "--reseed" ]
    networks:
      [internal]

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge
  
volumes:
  pgdata:
  miniodata:
  valkeydata:
  frontend_node_modules:

