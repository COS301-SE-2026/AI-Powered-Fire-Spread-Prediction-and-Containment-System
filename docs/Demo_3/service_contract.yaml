openapi: 3.1.0
info:
  title: FireAway API
  description: Backend for the AI-Powered Fire Spread Prediction and Containment System
  version: 1.0.0
paths:
  /api/admin/dashboard/summary:
    get:
      tags:
        - Admin Dashboard
      summary: Get Dashboard Summary
      operationId: get_dashboard_summary_api_admin_dashboard_summary_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummaryResponse'
        '400':
          description: Could not retrieve dashboard summary
  /api/admin/reported-fires:
    get:
      tags:
        - Admin
      summary: Get Reported Fires
      operationId: get_reported_fires_api_admin_reported_fires_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/FireReportMapResponse'
                type: array
                title: Response Get Reported Fires Api Admin Reported Fires Get
  /api/admin/reported-fires/{report_ref}:
    get:
      tags:
        - Admin
      summary: Get Fire Report Id
      operationId: get_fire_report_id_api_admin_reported_fires__report_ref__get
      parameters:
        - name: report_ref
          in: path
          required: true
          schema:
            type: string
            title: Report Ref
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FireReportDetailResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/reported-fires/{report_ref}/status:
    patch:
      tags:
        - Admin
      summary: Status Change
      operationId: status_change_api_admin_reported_fires__report_ref__status_patch
      parameters:
        - name: report_ref
          in: path
          required: true
          schema:
            type: string
            title: Report Ref
        - name: status
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/ReportStatus'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FireReportDetailResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/analytics/overview:
    get:
      tags:
        - Admin Analytics
      summary: Get Analytics Overview
      operationId: get_analytics_overview_api_admin_analytics_overview_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsOverviewResponse'
        '404':
          description: Could not retrieve analytics overview
  /api/admin/role-requests:
    get:
      tags:
        - Admin
      summary: Get Role Requests
      operationId: get_role_requests_api_admin_role_requests_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleRequestList'
  /api/admin/role-requests/{request_id}/approve:
    put:
      tags:
        - Admin
      summary: Approve Role Request
      operationId: approve_role_request_api_admin_role_requests__request_id__approve_put
      parameters:
        - name: request_id
          in: path
          required: true
          schema:
            type: string
            title: Request Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleRequestResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/role-requests/{request_id}/reject:
    put:
      tags:
        - Admin
      summary: Reject Role Request
      operationId: reject_role_request_api_admin_role_requests__request_id__reject_put
      parameters:
        - name: request_id
          in: path
          required: true
          schema:
            type: string
            title: Request Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleRequestResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/role-requests/{request_id}/revoke:
    put:
      tags:
        - Admin
      summary: Revoke Role Request
      operationId: revoke_role_request_api_admin_role_requests__request_id__revoke_put
      parameters:
        - name: request_id
          in: path
          required: true
          schema:
            type: string
            title: Request Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleRequestResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/login:
    post:
      tags:
        - Auth
      summary: Login Route
      operationId: login_route_api_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/LoginResponse'
                  - $ref: '#/components/schemas/Two_FA_Required_Response'
                title: Response Login Route Api Auth Login Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/me:
    get:
      tags:
        - Auth
      summary: Me Route
      operationId: me_route_api_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
  /api/auth/logout:
    post:
      tags:
        - Auth
      summary: Logout Route
      operationId: logout_route_api_auth_logout_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/auth/register:
    post:
      tags:
        - Auth
      summary: Register Route
      operationId: register_route_api_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Two_FA_Required_Response'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/setup-2fa:
    post:
      tags:
        - Auth
      summary: Setup 2Fa Route
      operationId: setup_2fa_route_api_auth_setup_2fa_post
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
            title: Username
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Two_FA_Create_Response'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/verify-2fa:
    post:
      tags:
        - Auth
      summary: Verify 2Fa Route
      operationId: verify_2fa_route_api_auth_verify_2fa_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Two_FA_Verify_Request'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/firefighter/reported-fires:
    get:
      tags:
        - Firefighter
      summary: Get Fire Reports
      operationId: get_fire_reports_api_firefighter_reported_fires_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportList'
        '404':
          description: No fire reports found
  /api/firefighter/reported-fires/search:
    get:
      tags:
        - Firefighter
      summary: Search Location Table
      operationId: search_location_table_api_firefighter_reported_fires_search_get
      parameters:
        - name: key
          in: query
          required: true
          schema:
            type: string
            title: Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportList'
        '404':
          description: key is not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/firefighter/reported-fires/{ref}:
    get:
      tags:
        - Firefighter
      summary: Get Single Fire Report
      operationId: get_single_fire_report_api_firefighter_reported_fires__ref__get
      parameters:
        - name: ref
          in: path
          required: true
          schema:
            type: string
            title: Ref
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirefighterReportModal'
        '404':
          description: Fire report not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/firefighter/dashboard:
    get:
      tags:
        - Firefighter
      summary: Get Nearby Fires
      operationId: get_nearby_fires_api_firefighter_dashboard_get
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
            title: Lat
        - name: lng
          in: query
          required: true
          schema:
            type: number
            title: Lng
        - name: radius_km
          in: query
          required: false
          schema:
            type: number
            default: 20
            title: Radius Km
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardData'
        '404':
          description: No nearby fires found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/firefighter/containment-line:
    post:
      tags:
        - Firefighter
      summary: Add Containment Line
      operationId: add_containment_line_api_firefighter_containment_line_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContainmentLine'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainmentLines'
        '400':
          description: fire not near the line
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/users/reported-fires:
    get:
      tags:
        - Users
      summary: Get Reported Fires
      operationId: get_reported_fires_api_users_reported_fires_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/FireReportMapResponse'
                type: array
                title: Response Get Reported Fires Api Users Reported Fires Get
    post:
      tags:
        - Users
      summary: Create Fire Report
      operationId: create_fire_report_api_users_reported_fires_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FireReportCreate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FireReportDetailResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/guests/reported-fires:
    get:
      tags:
        - Guests
      summary: Get Reported Fires
      operationId: get_reported_fires_api_guests_reported_fires_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FireReportMapResponse'
                title: Response Get Reported Fires Api Guests Reported Fires Get
    post:
      tags:
        - Guests
      summary: Create Fire Report
      operationId: create_fire_report_api_guests_reported_fires_post
      parameters:
        - name: user_id
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: null
            title: User Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FireReportCreate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FireReportDetailResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/guests/dashboard:
    get:
      tags:
        - Guests
      summary: Guest Dashboard
      operationId: guest_dashboard_api_guests_dashboard_get
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
            description: User latitude
            title: Lat
          description: User latitude
        - name: lng
          in: query
          required: true
          schema:
            type: number
            description: User longitude
            title: Lng
          description: User longitude
        - name: radius_km
          in: query
          required: false
          schema:
            type: number
            default: 20
            title: Radius Km
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Internal server error while fetching dashboard data
  /api/guests/nearby-fires:
    post:
      tags:
        - Guests
      summary: Get Nearby Fires For Guest
      description: |-
        Public endpoint: deliberately no get_current_user because they never log in,
        hence no account to authenticate, no persistence here
      operationId: get_nearby_fires_for_guest_api_guests_nearby_fires_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLocationIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/NotificationOut'
                type: array
                title: Response Get Nearby Fires For Guest Api Guests Nearby Fires Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/uploads/photo:
    post:
      tags:
        - Uploads
      summary: Upload Image Endpoint
      description: |-
        Anonymous image upload. Returns object_key string
        Frontend passes this to FireReportCase.image_url  when calls POST /api/users/reported-fires
      operationId: upload_image_endpoint_api_uploads_photo_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_image_endpoint_api_uploads_photo_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '400':
          description: Invalid file type or file size to big
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/simulate:
    post:
      tags:
        - simulation
      summary: Run Simulation
      description: |
        Endpoint for all verified fires

        Runs for 4 ticks which is a 1 hour spread simulation
      operationId: run_simulation_api_simulate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnDemandSimRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Internal server error simulation failed
  /api/simulate/fire/{fire_id}:
    post:
      tags:
        - simulation
      summary: Run Single Fire Simulation
      description: |
        Endpiont for spread on a single spread which spreads for 72 hours

        Runs the 72 hour spread which is 288 ticks for a fire selected on the map
      operationId: run_single_fire_simulation_api_simulate_fire__fire_id__post
      parameters:
        - name: fire_id
          in: path
          required: true
          schema:
            type: string
            title: Fire Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnDemandSimRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prediction'
        '404':
          description: Fire not found or verified
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Internal server error
  /api/users/me/location:
    patch:
      tags:
        - Users
      summary: Update My Location
      operationId: update_my_location_api_users_me_location_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLocationIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/notifications:
    get:
      tags:
        - Notifications
      summary: List Notifications
      description: |-
        Returns notifications from last `hours` (default 24h).
        For notifications sidebar recent-history view.
        Unread count scoped same way
      operationId: list_notifications_api_notifications_get
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            title: Limit
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            title: Offset
        - name: hours
          in: query
          required: false
          schema:
            type: integer
            default: 24
            title: Hours
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/notifications/{notification_id}/read:
    post:
      tags:
        - Notifications
      summary: Read Notification
      operationId: read_notification_api_notifications__notification_id__read_post
      parameters:
        - name: notification_id
          in: path
          required: true
          schema:
            type: string
            title: Notification Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/notifications/read-all:
    post:
      tags:
        - Notifications
      summary: Read All
      operationId: read_all_api_notifications_read_all_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /:
    get:
      summary: Read Root
      operationId: read_root__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/ping:
    get:
      summary: Ping
      operationId: ping_api_ping_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /health:
    get:
      summary: Health Check
      operationId: health_check_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
components:
  schemas:
    ActivityItemSchema:
      properties:
        id:
          type: string
          title: Id
        message:
          type: string
          title: Message
        timeAgo:
          type: string
          title: Timeago
      type: object
      required:
        - id
        - message
        - timeAgo
      title: ActivityItemSchema
    AnalyticsOverviewResponse:
      properties:
        kpis:
          $ref: '#/components/schemas/KPIs'
        pending_requests:
          items:
            $ref: '#/components/schemas/RoleRequestResponse'
          type: array
          title: Pending Requests
      type: object
      required:
        - kpis
        - pending_requests
      title: AnalyticsOverviewResponse
    Body_upload_image_endpoint_api_uploads_photo_post:
      properties:
        file:
          type: string
          format: binary
          title: File
      type: object
      required:
        - file
      title: Body_upload_image_endpoint_api_uploads_photo_post
    ContainmentLines:
      properties:
        id:
          type: string
          title: Id
        fire_report_id:
          type: string
          title: Fire Report Id
        line_geom:
          type: string
          title: Line Geom
        drawn_at:
          type: string
          format: date-time
          title: Drawn At
      type: object
      required:
        - id
        - fire_report_id
        - line_geom
        - drawn_at
      title: ContainmentLines
    CreateContainmentLine:
      properties:
        wkt:
          type: string
          title: Wkt
      type: object
      required:
        - wkt
      title: CreateContainmentLine
    DashboardData:
      properties:
        nearby_fires:
          $ref: '#/components/schemas/NearbyFiresList'
        environment_variables:
          $ref: '#/components/schemas/EnvironmentVariables'
      type: object
      required:
        - nearby_fires
        - environment_variables
      title: DashboardData
    DashboardSummaryResponse:
      properties:
        top_metrics:
          $ref: '#/components/schemas/TopMetricsSchema'
        activity_log:
          items:
            $ref: '#/components/schemas/ActivityItemSchema'
          type: array
          title: Activity Log
        weekly_incidents:
          items:
            $ref: '#/components/schemas/WeeklyDataSchema'
          type: array
          title: Weekly Incidents
        system_metrics:
          $ref: '#/components/schemas/SystemMetricsSchema'
      type: object
      required:
        - top_metrics
        - activity_log
        - weekly_incidents
        - system_metrics
      title: DashboardSummaryResponse
    EnvironmentVariables:
      properties:
        wind:
          type: number
          title: Wind
        wind_dir:
          type: integer
          title: Wind Dir
        temperature:
          type: number
          title: Temperature
        fire_danger:
          $ref: '#/components/schemas/FireDanger'
        humidity:
          type: number
          title: Humidity
      type: object
      required:
        - wind
        - wind_dir
        - temperature
        - fire_danger
        - humidity
      title: EnvironmentVariables
    FireDanger:
      type: string
      enum:
        - low
        - medium
        - high
        - very high
      title: FireDanger
    FireReportCreate:
      properties:
        lat:
          type: number
          maximum: 90.0
          minimum: -90.0
          title: Lat
        lng:
          type: number
          maximum: 180.0
          minimum: -180.0
          title: Lng
        location_text:
          type: string
          maxLength: 255
          minLength: 3
          title: Location Text
        description:
          anyOf:
            - type: string
              maxLength: 1000
            - type: null
          title: Description
        image_url:
          anyOf:
            - type: string
            - type: null
          title: Image Url
