components:
  schemas:
    ActivityItemSchema:
      properties:
        id:
          type: string
          title: Id
        message:
          type: string
          title: Message
        timeAgo:
          type: string
          title: Timeago
      type: object
      required:
      - id
      - message
      - timeAgo
      title: ActivityItemSchema
    AnalyticsOverviewResponse:
      properties:
        kpis:
          $ref: '#/components/schemas/KPIs'
        pending_requests:
          items:
            $ref: '#/components/schemas/RoleRequestResponse'
          type: array
          title: Pending Requests
      type: object
      required:
      - kpis
      - pending_requests
      title: AnalyticsOverviewResponse
    BearingFactor:
      properties:
        bearing_deg:
          type: number
          title: Bearing Deg
        factor:
          type: number
          title: Factor
      type: object
      required:
      - bearing_deg
      - factor
      title: BearingFactor
    Body_upload_image_endpoint_api_uploads_photo_post:
      properties:
        file:
          type: string
          format: binary
          title: File
      type: object
      required:
      - file
      title: Body_upload_image_endpoint_api_uploads_photo_post
    CapacityUnit:
      type: string
      enum:
      - liters
      - members
      - other
      title: CapacityUnit
    ClusterPrediction:
      properties:
        fire_refs:
          items:
            type: string
          type: array
          title: Fire Refs
        lat:
          type: number
          title: Lat
        lng:
          type: number
          title: Lng
        history:
          items:
            items:
              type: integer
            type: array
          type: array
          title: History
        burned_cells:
          type: integer
          title: Burned Cells
        radius_m:
